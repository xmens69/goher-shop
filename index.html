<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goher Shop — Brawl Stars</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:#fff}
main{max-width:700px;margin:auto;padding:24px}
h1{font-size:34px;margin-bottom:8px}
.sub{color:#b9c2d0;margin-bottom:24px}
.card{background:#1c293b;border-radius:18px;padding:18px;margin:14px 0}
.price{font-size:20px;font-weight:bold;margin:8px 0}
button{border:0;border-radius:12px;padding:12px 18px;background:#2ea6ff;color:white;font-weight:bold}
.note{font-size:13px;color:#9da9b8;margin-top:25px}
</style>
</head>
<body>
<main>
<h1>🛒 Goher Shop</h1>
<div class="sub">Товары и услуги для Brawl Stars</div>

<div class="card">
<h2>💎 Кристаллы</h2>
<p>Здесь позже будут варианты и цены.</p>
<div class="price">Цена: уточняется</div>
<button onclick="alert('Добавим оформление заказа следующим шагом!')">Заказать</button>
</div>

<div class="card">
<h2>🎁 Подарки</h2>
<p>Каталог подарков для Brawl Stars.</p>
<button onclick="alert('Добавим оформление заказа следующим шагом!')">Заказать</button>
</div>

<div class="card">
<h2>💬 Поддержка</h2>
<p>По вопросам заказа обращайся в поддержку.</p>
</div>

<div class="note">Goher Shop • Фан-магазин. Не является официальным магазином Supercell.</div>
</main>
</body>
</html>
